name: Deploy to InfinityFree
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create config.php from secrets
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          php -r '$o="<?php\n"; foreach(["host"=>"DB_HOST","user"=>"DB_USER","pass"=>"DB_PASS","db"=>"DB_NAME"] as $k=>$e){ $o.="\$".$k." = ".var_export(getenv($e),true).";\n"; } $o.="\$conn = mysqli_connect(\$host, \$user, \$pass, \$db);\nif (!\$conn) { die(\"Connection failed: \" . mysqli_connect_error()); }\n"; file_put_contents("config.php",$o);'

      - name: FTP deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            database.sql
